name: Dependency Lock Refresh

on:
  push:
    branches:
      - codex/narinyland-production-hardening
    paths:
      - '.github/workflows/dependency-lock-refresh.yml'

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v4
        with:
          ref: codex/narinyland-production-hardening

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply non-breaking production audit fixes to lockfile
        run: npm audit fix --omit=dev --package-lock-only || true

      - name: Commit regenerated lockfile when changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'No lockfile changes were required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore: apply production dependency audit fixes'
          git push origin HEAD:codex/narinyland-production-hardening

      - name: Report remaining production advisories
        run: npm audit --omit=dev --audit-level=high
