name: Sync couple feature with current main

on:
  push:
    branches: [feat/couple-world-adventures]
    paths:
      - '.github/workflows/sync-couple-main-once.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/couple-world-adventures
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Merge upstream security fixes and preserve couple features
        run: |
          set -e
          git fetch origin main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-commit --no-ff origin/main || {
            conflicts="$(git diff --name-only --diff-filter=U)"
            for filename in $conflicts; do
              case "$filename" in
                package.json|package-lock.json|lib/redis.ts)
                  git checkout origin/main -- "$filename"
                  ;;
                *)
                  echo "Unexpected conflict: $filename"
                  exit 1
                  ;;
              esac
            done
          }
          git checkout origin/main -- package.json package-lock.json lib/redis.ts
          git add package.json package-lock.json lib/redis.ts
          test -z "$(git diff --name-only --diff-filter=U)"
          npm ci
          npm audit --omit=dev --audit-level=high
          git commit --no-edit -m 'merge(main): retain upstream dependency and Redis security fixes'
          git push origin HEAD:feat/couple-world-adventures
