name: Refresh AppKit SDK Lockfile

on:
  push:
    branches: [codex/appkit-sdk-v1-headless-auth]
    paths:
      - 'package.json'
      - '.github/workflows/sdk-lock-refresh.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/appkit-sdk-v1-headless-auth
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: refresh lockfile for AppKit SDK"
          git push origin HEAD:codex/appkit-sdk-v1-headless-auth
