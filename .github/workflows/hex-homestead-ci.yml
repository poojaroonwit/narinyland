name: Hex Homestead CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/hex-world/**'
      - 'lib/**'
      - 'services/**'
      - 'prisma/schema.prisma'
      - 'prisma/migrations/**'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'
      - 'tests/hex-*.test.ts'
      - 'tests/garden-hex-integration.test.ts'
      - 'tests/production-startup.test.ts'
      - '.github/workflows/hex-homestead-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: narinyland_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d narinyland_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/narinyland_ci
      NEXT_PUBLIC_API_URL: /api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit report
        run: npm audit --omit=dev --json || true

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Apply migrations to CI Postgres
        run: npx prisma migrate deploy

      - name: Hex Homestead pure tests
        env:
          NODE_ENV: production
        run: |
          PURE_HEX_TESTS=$(find tests -maxdepth 1 -name 'hex-*.test.ts' ! -name 'hex-world-undo-db.test.ts' -print | sort | tr '\n' ' ')
          node --import tsx --test $PURE_HEX_TESTS tests/garden-hex-integration.test.ts tests/production-startup.test.ts

      - name: Hex Undo DB and Redis integration
        env:
          NODE_ENV: production
          REDIS_URL: redis://127.0.0.1:6379
        run: node --import tsx --test tests/hex-world-undo-db.test.ts

      - name: Existing farm regression
        run: node --import tsx --test tests/family-farm-game.test.ts

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
