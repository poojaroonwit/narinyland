name: Hex Homestead CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/hex-world/**'
      - 'components/Shop.tsx'
      - 'lib/**'
      - 'services/**'
      - 'prisma/schema.prisma'
      - 'prisma/migrations/**'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'
      - 'tsconfig.json'
      - '.gitignore'
      - 'tests/hex-*.test.ts'
      - 'tests/garden-hex-integration.test.ts'
      - 'tests/production-startup.test.ts'
      - 'tests/security-hardening-v2.test.ts'
      - '.github/workflows/hex-homestead-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: narinyland_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d narinyland_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/narinyland_ci
      NEXT_PUBLIC_API_URL: /api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Block high production dependency advisories
        run: npm audit --omit=dev --audit-level=high

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Apply migrations to CI Postgres
        run: npx prisma migrate deploy

      - name: Security hardening v2 regressions
        env:
          NODE_ENV: production
        run: node --import tsx --test tests/security-hardening-v2.test.ts

      - name: Hex Homestead pure tests
        env:
          NODE_ENV: production
        run: |
          PURE_HEX_TESTS=$(find tests -maxdepth 1 -name 'hex-*.test.ts' ! -name 'hex-world-undo-db.test.ts' -print | sort | tr '\n' ' ')
          node --import tsx --test $PURE_HEX_TESTS tests/garden-hex-integration.test.ts tests/production-startup.test.ts

      - name: Hex Undo DB and Redis integration
        env:
          NODE_ENV: production
          REDIS_URL: redis://127.0.0.1:6379
        run: node --import tsx --test tests/hex-world-undo-db.test.ts

      - name: Existing farm regression
        run: node --import tsx --test tests/family-farm-game.test.ts

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Production runtime smoke
        env:
          NODE_ENV: production
          REDIS_URL: redis://127.0.0.1:6379
          PORT: 3000
          HOSTNAME: 127.0.0.1
        run: |
          set -euo pipefail
          mkdir -p .next/standalone/.next
          rm -rf .next/standalone/public .next/standalone/.next/static
          cp -R public .next/standalone/public
          cp -R .next/static .next/standalone/.next/static

          node .next/standalone/server.js > /tmp/narinyland-smoke.log 2>&1 &
          APP_PID=$!
          cleanup() {
            kill $APP_PID 2>/dev/null || true
          }
          dump_logs() {
            echo '--- Narinyland standalone log ---'
            cat /tmp/narinyland-smoke.log || true
            echo '--- End standalone log ---'
          }
          trap cleanup EXIT
          trap dump_logs ERR

          HEALTHY=false
          for attempt in $(seq 1 30); do
            if ! kill -0 $APP_PID 2>/dev/null; then
              echo 'Standalone server exited before becoming healthy.'
              exit 1
            fi
            if curl --fail --silent http://127.0.0.1:3000/api/health > /tmp/health.json; then
              HEALTHY=true
              break
            fi
            sleep 1
          done

          if [ "$HEALTHY" != "true" ]; then
            echo 'Standalone server did not become healthy.'
            exit 1
          fi

          cat /tmp/health.json
          grep -q '"database":"ok"' /tmp/health.json
          curl --fail --silent http://127.0.0.1:3000/login > /tmp/login.html
          test -s /tmp/login.html
