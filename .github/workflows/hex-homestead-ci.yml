name: Hex Homestead CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/api/hex-world/**'
      - 'app/garden/**'
      - 'components/hex-world/**'
      - 'lib/hex-world/**'
      - 'lib/stats-service.ts'
      - 'services/hex-world-api.ts'
      - 'prisma/schema.prisma'
      - 'prisma/migrations/20260820000000_add_hex_homestead/**'
      - 'Dockerfile'
      - 'tests/hex-*.test.ts'
      - 'tests/garden-hex-integration.test.ts'
      - 'tests/production-startup.test.ts'
      - '.github/workflows/hex-homestead-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/narinyland_ci
      NEXT_PUBLIC_API_URL: /api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Hex Homestead tests
        env:
          NODE_ENV: production
        run: >-
          node --import tsx --test
          tests/hex-grid.test.ts
          tests/hex-building-catalog.test.ts
          tests/hex-world-generator.test.ts
          tests/hex-world-rules.test.ts
          tests/hex-world-schema.test.ts
          tests/hex-world-service.test.ts
          tests/hex-world-api-contract.test.ts
          tests/hex-world-rendering.test.ts
          tests/hex-build-state.test.ts
          tests/garden-hex-integration.test.ts
          tests/production-startup.test.ts

      - name: Existing farm regression
        run: node --import tsx --test tests/family-farm-game.test.ts

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
