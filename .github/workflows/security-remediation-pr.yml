name: Automated dependency remediation (couple PR)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/security-remediation-pr.yml'

permissions:
  contents: write

jobs:
  update-dependency-lock:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/couple-world-adventures'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Update safe dependency versions
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit fix --package-lock-only --ignore-scripts --no-fund || true
      - name: Verify production advisories
        run: npm audit --omit=dev --audit-level=high
      - name: Commit audited lockfile
        run: |
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already up to date."
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(security): refresh vetted dependency lockfile'
          git push origin HEAD:${{ github.head_ref }}
